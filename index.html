<!DOCTYPE html>
<html>
<head>
    <title>Exercise 3 - Multiples Function</title>
    <script>
        function findMultiplesSum(a, b, n) {
            let sum = 0;
            for (let i = 0; i < n; i++) {
                if (i % a === 0 || i % b === 0) {
                    sum += i;
                }
            }
            return sum;
        }

        function handleClick() {
            let a = parseInt(document.getElementById("a").value);
            let b = parseInt(document.getElementById("b").value);
            let n = parseInt(document.getElementById("n").value);

            if (isNaN(a) || isNaN(b) || isNaN(n)) {
                alert("Please enter valid numbers for a, b, and n.");
                return;
            }

            let result = findMultiplesSum(a, b, n);
            alert("The sum of all multiples of " + a + " or " + b + " below " + n + " is: " + result);
        }
    </script>
</head>
<body>
    <p>Exercise 3, Functions:</p>
    <p>Create a page with a button and three input boxes, labelled a, b and n</p>
    <p>When the user clicks,</p>
    <p>
        Create a function to return the sum of all the multiples of a or b below n<br>
        Call the function and alert the user to the correct answer when they press the button.
    </p>

    <label for="a">a:</label>
    <input type="text" id="a"><br><br>

    <label for="b">b:</label>
    <input type="text" id="b"><br><br>

    <label for="n">n:</label>
    <input type="text" id="n"><br><br>

    <button onclick="handleClick()">Calculate Sum</button>
</body>
</html>
